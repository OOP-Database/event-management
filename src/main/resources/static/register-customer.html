<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="/css/style.css">
  <title>Đăng ký khách hàng – EventTickets</title>
</head>
<body class="ev-body">
  <header id="ev-header"></header>

  <main class="ev-auth-wrap">
    <div class="ev-card ev-auth-card wide">
      <h1 class="ev-auth-title">Đăng ký khách hàng</h1>
      <p class="ev-auth-sub">Tạo tài khoản để đặt vé sự kiện.</p>
      <div id="alert"></div>

      <form id="registerForm" novalidate>
        <div class="row g-3">
          <div class="col-12 ev-field">
            <label class="ev-label ev-req" for="name">Họ và tên</label>
            <input type="text" class="form-control" id="name" name="name" maxlength="200" autocomplete="name" required>
            <div class="invalid-feedback"></div>
          </div>
          <div class="col-md-6 ev-field">
            <label class="ev-label ev-req" for="email">Email</label>
            <input type="email" class="form-control" id="email" name="email" maxlength="200" autocomplete="email" required>
            <div class="invalid-feedback"></div>
          </div>
          <div class="col-md-6 ev-field">
            <label class="ev-label ev-req" for="phoneNumber">Số điện thoại</label>
            <input type="tel" class="form-control" id="phoneNumber" name="phoneNumber" maxlength="15" autocomplete="tel" required>
            <div class="invalid-feedback"></div>
          </div>
          <div class="col-md-6 ev-field">
            <label class="ev-label ev-req" for="gender">Giới tính</label>
            <select class="form-select" id="gender" name="gender" required>
              <option value="">-- Chọn --</option>
              <option value="Male">Nam</option>
              <option value="Female">Nữ</option>
              <option value="Other">Khác</option>
            </select>
            <div class="invalid-feedback"></div>
          </div>
          <div class="col-md-6 ev-field">
            <label class="ev-label ev-req" for="dateOfBirth">Ngày sinh</label>
            <input type="date" class="form-control" id="dateOfBirth" name="dateOfBirth" required>
            <div class="invalid-feedback"></div>
          </div>
          <div class="col-md-6 ev-field">
            <label class="ev-label ev-req" for="password">Mật khẩu</label>
            <div class="ev-pw-wrap">
              <input type="password" class="form-control" id="password" name="password" autocomplete="new-password" required>
              <button type="button" class="ev-pw-toggle" data-ev-pw="password">Hiện</button>
            </div>
            <div class="form-text">Tối thiểu 8 ký tự, gồm chữ và số.</div>
            <div class="invalid-feedback"></div>
          </div>
          <div class="col-md-6 ev-field">
            <label class="ev-label ev-req" for="confirmPassword">Nhập lại mật khẩu</label>
            <div class="ev-pw-wrap">
              <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" autocomplete="new-password" required>
              <button type="button" class="ev-pw-toggle" data-ev-pw="confirmPassword">Hiện</button>
            </div>
            <div class="invalid-feedback"></div>
          </div>
        </div>
        <button type="submit" class="ev-btn ev-btn-primary ev-btn-block mt-4" id="submitBtn">Tạo tài khoản</button>
      </form>

      <div class="ev-auth-foot">
        Đã có tài khoản? <a href="/login.html">Đăng nhập</a> ·
        <a href="/register-organizer.html">Đăng ký nhà tổ chức</a>
      </div>
    </div>
  </main>

  <footer id="ev-footer"></footer>

  <script src="/js/config.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/layout.js"></script>
  <script>
    (async function () {
      const form = document.getElementById('registerForm');
      const alertBox = document.getElementById('alert');
      const submitBtn = document.getElementById('submitBtn');
      const ENDPOINT = '/api/auth/register/customer';
      document.getElementById("dateOfBirth").max = new Date().toISOString().slice(0, 10);
      const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      function collect() {
        return { name: form.name.value.trim(), email: form.email.value.trim(), phoneNumber: form.phoneNumber.value.trim(),
                 gender: form.gender.value, dateOfBirth: form.dateOfBirth.value };
      }
      function validate(b) {
        const p = {};
        if (!b.name) p.name = "Vui lòng nhập họ tên.";
        if (!b.email) p.email = "Vui lòng nhập email."; else if (!EMAIL_RE.test(b.email)) p.email = "Email không hợp lệ.";
        if (!/^\+?[0-9]{9,14}$/.test(b.phoneNumber)) p.phoneNumber = "Số điện thoại gồm 9-14 chữ số.";
        if (!b.gender) p.gender = "Vui lòng chọn giới tính.";
        if (!b.dateOfBirth) p.dateOfBirth = "Vui lòng nhập ngày sinh.";
        else if (b.dateOfBirth >= new Date().toISOString().slice(0, 10)) p.dateOfBirth = "Ngày sinh phải ở quá khứ.";
        return p;
      }

      Utils.bindPasswordToggles();
      const current = await Layout.init({});
      if (current) { Auth.redirectAfterLogin(current, null); return; }

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        Utils.clearAlert(alertBox);
        Utils.clearFieldErrors(form);

        const body = collect();
        const problems = validate(body);
        const password = form.password.value;
        if (password.length < 8) problems.password = 'Mật khẩu tối thiểu 8 ký tự.';
        else if (!/[A-Za-z]/.test(password) || !/[0-9]/.test(password)) problems.password = 'Mật khẩu phải có cả chữ cái và chữ số.';
        if (form.confirmPassword.value !== password) problems.confirmPassword = 'Mật khẩu nhập lại không khớp.';
        if (Object.keys(problems).length) { Utils.showFieldErrors(form, problems); return; }

        body.password = password;
        Utils.setLoading(submitBtn, true, 'Đang tạo tài khoản...');
        try {
          await Api.post(ENDPOINT, body, { redirectOn401: false });
          Utils.showAlert(alertBox, 'success', 'Đăng ký thành công! Đang chuyển tới trang đăng nhập...');
          setTimeout(() => { window.location.href = '/login.html?registered=1'; }, 1200);
        } catch (err) {
          Utils.setLoading(submitBtn, false);
          if (!Utils.showFieldErrors(form, err.data)) Utils.showAlert(alertBox, 'danger', err.message);
        }
      });
    })();
  </script>
</body>
</html>
