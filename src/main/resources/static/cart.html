<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Giỏ vé</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <main class="container my-4">
    <h1 class="h3 mb-3">Giỏ vé của bạn</h1>

    <div id="cartEmpty" class="alert alert-info d-none">
      Giỏ vé đang trống. <a href="/events.html">Xem sự kiện</a>
    </div>

    <div id="cartContent" class="d-none">
      <div class="table-responsive">
        <table class="table align-middle">
          <thead>
            <tr><th>Sự kiện / Hạng vé</th><th>Đơn giá</th><th>Số lượng</th><th>Thành tiền</th><th></th></tr>
          </thead>
          <tbody id="cartBody"></tbody>
        </table>
      </div>
      <div class="d-flex justify-content-between align-items-center">
        <button id="btnClear" class="btn btn-outline-secondary">Xóa giỏ</button>
        <div>
          <span class="fs-5">Tổng: <strong id="cartTotal">0 ₫</strong></span>
          <a href="/checkout.html" class="btn btn-primary ms-3">Tiến hành đặt vé</a>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/fe3-utils.js"></script>
  <script src="/js/mock/fe3-mock-api.js"></script>
  <script src="/js/cart.js"></script>
</body>
</html>
