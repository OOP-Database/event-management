<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="/css/style.css">
  <title>Quản lý người dùng – EventTickets Admin</title>
</head>
<body class="ev-body">
  <header id="ev-header"></header>

  <div class="ev-layout">
    <aside id="ev-sidebar"></aside>

    <main class="ev-content">
      <h1 class="ev-page-title">Người dùng</h1>
      <p class="ev-page-sub">Danh sách tài khoản trong hệ thống.</p>

      <section class="ev-card">
        <div class="row g-2 mb-3">
          <div class="col-md-4">
            <select class="form-select" id="roleFilter" aria-label="Lọc theo vai trò">
              <option value="">Tất cả vai trò</option>
              <option value="ADMIN">Quản trị viên</option>
              <option value="ORGANIZER">Nhà tổ chức</option>
              <option value="CUSTOMER">Khách hàng</option>
            </select>
          </div>
          <div class="col-md-5">
            <input type="search" class="form-control" id="search" placeholder="Tìm theo tên, email, số điện thoại...">
          </div>
          <div class="col-md-3 text-md-end"><span class="text-muted" id="count"></span></div>
        </div>

        <div id="state" class="ev-state" style="display:none;"></div>
        <div class="ev-table-wrap" id="tableWrap" style="display:none;">
          <table class="ev-table">
            <thead><tr><th>Mã</th><th>Họ tên</th><th>Email</th><th>Điện thoại</th><th>Vai trò</th></tr></thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <footer id="ev-footer"></footer>

  <script src="/js/config.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/admin-users.js"></script>
</body>
</html>
