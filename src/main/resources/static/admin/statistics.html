<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="/css/style.css">
  <title>Thống kê hệ thống – EventTickets Admin</title>
</head>
<body class="ev-body">
  <header id="ev-header"></header>

  <div class="ev-layout">
    <aside id="ev-sidebar"></aside>

    <main class="ev-content">
      <div class="d-flex justify-content-between align-items-start flex-wrap gap-2 mb-3">
        <div>
          <h1 class="ev-page-title">Thống kê hệ thống</h1>
          <p class="ev-page-sub mb-0">Tổng quan người dùng, sự kiện và doanh thu.</p>
        </div>
        <button type="button" class="ev-btn ev-btn-outline" id="reloadBtn">Tải lại số liệu</button>
      </div>

      <div id="state" class="ev-state" style="display:none;"></div>

      <div id="content" style="display:none;">
        <div class="row g-3 mb-3">
          <div class="col-12 col-md-6"><div class="ev-stat"><div class="ev-stat-label">Tổng người dùng</div><div class="ev-stat-value" id="statUsers">—</div></div></div>
          <div class="col-12 col-md-6"><div class="ev-stat"><div class="ev-stat-label">Tổng doanh thu (đơn đã thanh toán)</div><div class="ev-stat-value money" id="statRevenue">—</div></div></div>
          <div class="col-6 col-md-3"><div class="ev-stat"><div class="ev-stat-label">Tổng sự kiện</div><div class="ev-stat-value" id="statEventsTotal">—</div></div></div>
          <div class="col-6 col-md-3"><div class="ev-stat"><div class="ev-stat-label">Chờ duyệt (PENDING)</div><div class="ev-stat-value" id="statPending">—</div></div></div>
          <div class="col-6 col-md-3"><div class="ev-stat"><div class="ev-stat-label">Đã duyệt (APPROVED)</div><div class="ev-stat-value" id="statApproved">—</div></div></div>
          <div class="col-6 col-md-3"><div class="ev-stat"><div class="ev-stat-label">Từ chối (REJECTED)</div><div class="ev-stat-value" id="statRejected">—</div></div></div>
        </div>

        <section class="ev-card">
          <div class="ev-card-title">Sự kiện theo trạng thái</div>
          <div id="bars"></div>
        </section>

        <div id="notice" class="mt-3"></div>
        <details class="mt-3">
          <summary class="text-muted" style="cursor:pointer;">Dữ liệu gốc từ API (dùng khi đối chiếu với BE4)</summary>
          <pre id="raw" class="ev-card mt-2" style="white-space:pre-wrap;font-size:.85rem;"></pre>
        </details>
      </div>
    </main>
  </div>

  <footer id="ev-footer"></footer>

  <script src="/js/config.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/admin-statistics.js"></script>
</body>
</html>
