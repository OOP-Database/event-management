<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="/css/style.css">
  <title>Hồ sơ của tôi – EventTickets</title>
</head>
<body class="ev-body">
  <header id="ev-header"></header>

  <main class="ev-container" style="max-width: 820px;">
    <h1 class="ev-page-title">Hồ sơ của tôi</h1>
    <p class="ev-page-sub">Xem và cập nhật thông tin tài khoản.</p>

    <div id="state" class="ev-state"><span class="ev-spinner dark"></span><div class="mt-2">Đang tải hồ sơ...</div></div>

    <div id="content" style="display:none;">
      <section class="ev-card">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <div class="ev-card-title mb-0">Thông tin cá nhân</div>
          <span id="roleBadge" class="ev-badge"></span>
        </div>
        <div id="profileAlert"></div>
        <form id="profileForm" novalidate>
          <div class="row g-3">
            <div class="col-md-6 ev-field">
              <label class="ev-label" for="id">Mã tài khoản</label>
              <input type="text" class="form-control ev-readonly" id="id" readonly>
            </div>
            <div class="col-md-6 ev-field">
              <label class="ev-label" for="email">Email (dùng để đăng nhập)</label>
              <input type="text" class="form-control ev-readonly" id="email" readonly>
            </div>
            <div class="col-md-6 ev-field">
              <label class="ev-label ev-req" for="name">Họ và tên</label>
              <input type="text" class="form-control" id="name" name="name" maxlength="200" required>
              <div class="invalid-feedback"></div>
            </div>
            <div class="col-md-6 ev-field">
              <label class="ev-label ev-req" for="phoneNumber">Số điện thoại</label>
              <input type="tel" class="form-control" id="phoneNumber" name="phoneNumber" maxlength="15" required>
              <div class="invalid-feedback"></div>
            </div>

            <!-- Customer -->
            <div class="col-md-6 ev-field" data-role="ROLE_CUSTOMER">
              <label class="ev-label ev-req" for="gender">Giới tính</label>
              <select class="form-select" id="gender" name="gender">
                <option value="Male">Nam</option>
                <option value="Female">Nữ</option>
                <option value="Other">Khác</option>
              </select>
              <div class="invalid-feedback"></div>
            </div>
            <div class="col-md-6 ev-field" data-role="ROLE_CUSTOMER">
              <label class="ev-label ev-req" for="dateOfBirth">Ngày sinh</label>
              <input type="date" class="form-control" id="dateOfBirth" name="dateOfBirth">
              <div class="invalid-feedback"></div>
            </div>

            <!-- Organizer -->
            <div class="col-md-6 ev-field" data-role="ROLE_ORGANIZER">
              <label class="ev-label" for="taxCode">Mã số thuế</label>
              <input type="text" class="form-control ev-readonly" id="taxCode" readonly>
            </div>
            <div class="col-md-6 ev-field" data-role="ROLE_ORGANIZER">
              <label class="ev-label ev-req" for="address">Địa chỉ</label>
              <input type="text" class="form-control" id="address" name="address" maxlength="200">
              <div class="invalid-feedback"></div>
            </div>
          </div>
          <div class="mt-4 d-flex gap-2">
            <button type="submit" class="ev-btn ev-btn-primary" id="saveBtn">Lưu thay đổi</button>
            <button type="button" class="ev-btn ev-btn-outline" id="resetBtn">Hoàn tác</button>
          </div>
        </form>
      </section>

      <section class="ev-card">
        <div class="ev-card-title">Đổi mật khẩu</div>
        <div id="pwAlert"></div>
        <form id="pwForm" novalidate>
          <div class="row g-3">
            <div class="col-12 ev-field">
              <label class="ev-label ev-req" for="currentPassword">Mật khẩu hiện tại</label>
              <div class="ev-pw-wrap">
                <input type="password" class="form-control" id="currentPassword" name="currentPassword" autocomplete="current-password">
                <button type="button" class="ev-pw-toggle" data-ev-pw="currentPassword">Hiện</button>
              </div>
              <div class="invalid-feedback"></div>
            </div>
            <div class="col-md-6 ev-field">
              <label class="ev-label ev-req" for="newPassword">Mật khẩu mới</label>
              <div class="ev-pw-wrap">
                <input type="password" class="form-control" id="newPassword" name="newPassword" autocomplete="new-password">
                <button type="button" class="ev-pw-toggle" data-ev-pw="newPassword">Hiện</button>
              </div>
              <div class="form-text">Tối thiểu 8 ký tự, gồm chữ và số.</div>
              <div class="invalid-feedback"></div>
            </div>
            <div class="col-md-6 ev-field">
              <label class="ev-label ev-req" for="confirmNewPassword">Nhập lại mật khẩu mới</label>
              <div class="ev-pw-wrap">
                <input type="password" class="form-control" id="confirmNewPassword" name="confirmNewPassword" autocomplete="new-password">
                <button type="button" class="ev-pw-toggle" data-ev-pw="confirmNewPassword">Hiện</button>
              </div>
              <div class="invalid-feedback"></div>
            </div>
          </div>
          <button type="submit" class="ev-btn ev-btn-outline mt-4" id="pwBtn">Đổi mật khẩu</button>
        </form>
      </section>
    </div>
  </main>

  <footer id="ev-footer"></footer>

  <script src="/js/config.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/layout.js"></script>
  <script>
    (async function () {
      const stateBox = document.getElementById('state');
      const content = document.getElementById('content');
      const profileForm = document.getElementById('profileForm');
      const profileAlert = document.getElementById('profileAlert');
      const saveBtn = document.getElementById('saveBtn');
      const pwForm = document.getElementById('pwForm');
      const pwAlert = document.getElementById('pwAlert');
      const pwBtn = document.getElementById('pwBtn');
      const BADGE = { ROLE_ADMIN: 'ev-badge-admin', ROLE_ORGANIZER: 'ev-badge-organizer', ROLE_CUSTOMER: 'ev-badge-customer' };
      let profile = null;

      Utils.bindPasswordToggles();
      await Layout.init({ active: '/profile.html' });

      const me = await Auth.requireRole([]); // cần đăng nhập, mọi role đều xem được hồ sơ
      if (!me) return;

      function fill(p) {
        profile = p;
        document.getElementById('id').value = p.id || '';
        document.getElementById('email').value = p.email || '';
        profileForm.name.value = p.name || '';
        profileForm.phoneNumber.value = p.phoneNumber || '';
        // Chỉ hiện các trường có thật theo loại tài khoản
        profileForm.querySelectorAll('[data-role]').forEach((el) => { el.style.display = el.dataset.role === p.role ? '' : 'none'; });
        if (p.role === 'ROLE_CUSTOMER') {
          profileForm.gender.value = p.gender || 'Other';
          profileForm.dateOfBirth.value = p.dateOfBirth || '';
          profileForm.dateOfBirth.max = new Date().toISOString().slice(0, 10);
        } else if (p.role === 'ROLE_ORGANIZER') {
          document.getElementById('taxCode').value = p.taxCode || '';
          profileForm.address.value = p.address || '';
        }
        const badge = document.getElementById('roleBadge');
        badge.className = 'ev-badge ' + (BADGE[p.role] || '');
        badge.textContent = Auth.roleLabel(p.role);
      }

      async function load() {
        try {
          fill(await Api.get('/api/users/me'));
          stateBox.style.display = 'none';
          content.style.display = '';
        } catch (err) {
          stateBox.innerHTML = '<div class="alert alert-danger ev-alert">' + Utils.escapeHtml(err.message) + '</div>'
            + '<button class="ev-btn ev-btn-outline" id="retry">Thử lại</button>';
          document.getElementById('retry').addEventListener('click', () => {
            stateBox.innerHTML = '<span class="ev-spinner dark"></span>';
            load();
          });
        }
      }

      document.getElementById('resetBtn').addEventListener('click', () => { fill(profile); Utils.clearFieldErrors(profileForm); Utils.clearAlert(profileAlert); });

      profileForm.addEventListener('submit', async (event) => {
        event.preventDefault();
        Utils.clearAlert(profileAlert);
        Utils.clearFieldErrors(profileForm);

        const body = { name: profileForm.name.value.trim(), phoneNumber: profileForm.phoneNumber.value.trim() };
        const problems = {};
        if (!body.name) problems.name = 'Vui lòng nhập họ tên.';
        if (!/^\+?[0-9]{9,14}$/.test(body.phoneNumber)) problems.phoneNumber = 'Số điện thoại gồm 9-14 chữ số.';
        if (profile.role === 'ROLE_CUSTOMER') {
          body.gender = profileForm.gender.value;
          body.dateOfBirth = profileForm.dateOfBirth.value;
          if (!body.dateOfBirth) problems.dateOfBirth = 'Vui lòng nhập ngày sinh.';
        } else if (profile.role === 'ROLE_ORGANIZER') {
          body.address = profileForm.address.value.trim();
          if (!body.address) problems.address = 'Vui lòng nhập địa chỉ.';
        }
        if (Object.keys(problems).length) { Utils.showFieldErrors(profileForm, problems); return; }

        Utils.setLoading(saveBtn, true, 'Đang lưu...');
        try {
          const updated = await Api.put('/api/users/me', body);
          fill(updated);
          Auth.setCurrentUser(updated);
          Layout.refresh();
          Utils.showAlert(profileAlert, 'success', 'Cập nhật hồ sơ thành công.');
        } catch (err) {
          if (!Utils.showFieldErrors(profileForm, err.data)) Utils.showAlert(profileAlert, 'danger', err.message);
        } finally {
          Utils.setLoading(saveBtn, false);
        }
      });

      pwForm.addEventListener('submit', async (event) => {
        event.preventDefault();
        Utils.clearAlert(pwAlert);
        Utils.clearFieldErrors(pwForm);

        const current = pwForm.currentPassword.value;
        const next = pwForm.newPassword.value;
        const problems = {};
        if (!current) problems.currentPassword = 'Vui lòng nhập mật khẩu hiện tại.';
        if (next.length < 8) problems.newPassword = 'Mật khẩu mới tối thiểu 8 ký tự.';
        else if (!/[A-Za-z]/.test(next) || !/[0-9]/.test(next)) problems.newPassword = 'Mật khẩu mới phải có cả chữ cái và chữ số.';
        if (pwForm.confirmNewPassword.value !== next) problems.confirmNewPassword = 'Mật khẩu nhập lại không khớp.';
        if (Object.keys(problems).length) { Utils.showFieldErrors(pwForm, problems); return; }

        Utils.setLoading(pwBtn, true, 'Đang đổi...');
        try {
          await Api.put('/api/users/me/password', { currentPassword: current, newPassword: next });
          pwForm.reset();
          Utils.showAlert(pwAlert, 'success', 'Đổi mật khẩu thành công.');
        } catch (err) {
          if (!Utils.showFieldErrors(pwForm, err.data)) Utils.showAlert(pwAlert, 'danger', err.message);
        } finally {
          Utils.setLoading(pwBtn, false);
        }
      });

      load();
    })();
  </script>
</body>
</html>
