<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Xác nhận đơn hàng</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <main class="container my-4">
    <h1 class="h3 mb-3">Xác nhận đơn hàng</h1>
    <div id="message"></div>

    <div class="table-responsive">
      <table class="table">
        <thead>
          <tr><th>Sự kiện</th><th>Hạng vé</th><th>SL</th><th>Thành tiền</th></tr>
        </thead>
        <tbody id="summaryBody"></tbody>
        <tfoot>
          <tr><th colspan="3" class="text-end">Tổng cộng</th><th id="summaryTotal"></th></tr>
        </tfoot>
      </table>
    </div>

    <div class="mb-3" style="max-width:320px">
      <label for="paymentMethod" class="form-label">Phương thức thanh toán</label>
      <select id="paymentMethod" class="form-select">
        <option value="Chuyển khoản">Chuyển khoản</option>
        <option value="Thẻ">Thẻ</option>
        <option value="Ví điện tử">Ví điện tử</option>
      </select>
    </div>

    <a href="/cart.html" class="btn btn-outline-secondary">Quay lại giỏ</a>
    <button id="btnPay" class="btn btn-success">Xác nhận và thanh toán</button>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/fe3-utils.js"></script>
  <script src="/js/mock/fe3-mock-api.js"></script>
  <script src="/js/cart.js"></script>
  <script src="/js/checkout.js"></script>
</body>
</html>
