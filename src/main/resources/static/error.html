<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="/css/style.css">
  <title>Có lỗi xảy ra – EventTickets</title>
</head>
<body class="ev-body">
  <header id="ev-header"></header>
  <main class="ev-auth-wrap">
    <div class="ev-card ev-auth-card text-center">
      <div id="code" style="font-size:3.5rem;font-weight:800;color:var(--ev-primary);">404</div>
      <h1 class="ev-auth-title" id="title">Không tìm thấy trang</h1>
      <p class="ev-auth-sub" id="desc">Trang bạn tìm không tồn tại hoặc đã bị di chuyển.</p>
      <div class="d-flex gap-2 justify-content-center flex-wrap">
        <a class="ev-btn ev-btn-primary" href="/index.html">Về trang chủ</a>
        <a class="ev-btn ev-btn-outline" href="/login.html">Đăng nhập</a>
      </div>
    </div>
  </main>
  <footer id="ev-footer"></footer>

  <script src="/js/config.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/layout.js"></script>
  <script>
    (function () {
      const code = Utils.queryParam('code') === '403' ? '403' : '404';
      const text = {
        '403': ['Không có quyền truy cập', 'Tài khoản của bạn không có quyền xem trang này.'],
        '404': ['Không tìm thấy trang', 'Trang bạn tìm không tồn tại hoặc đã bị di chuyển.']
      }[code];
      document.getElementById('code').textContent = code;
      document.getElementById('title').textContent = text[0];
      document.getElementById('desc').textContent = text[1];
      Layout.init({});
    })();
  </script>
</body>
</html>
