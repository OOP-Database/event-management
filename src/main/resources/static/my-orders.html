<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đơn hàng của tôi</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <main class="container my-4">
    <h1 class="h3 mb-3">Đơn hàng của tôi</h1>
    <div id="message"></div>

    <div class="mb-3" style="max-width:260px">
      <select id="statusFilter" class="form-select">
        <option value="">Tất cả trạng thái</option>
        <option>Chờ thanh toán</option>
        <option>Đã thanh toán</option>
        <option>Đã hủy</option>
        <option>Đã hoàn tiền</option>
      </select>
    </div>

    <div class="table-responsive">
      <table class="table table-hover align-middle">
        <thead>
          <tr><th>Mã đơn</th><th>Ngày đặt</th><th>Tổng tiền</th><th>Trạng thái</th><th></th></tr>
        </thead>
        <tbody id="ordersBody"></tbody>
      </table>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/fe3-utils.js"></script>
  <script src="/js/mock/fe3-mock-api.js"></script>
  <script src="/js/my-orders.js"></script>
</body>
</html>
