spring.application.name=eventmanagement
server.port=8080
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/event_tickets}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123456}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Session cookie (BE1): HttpOnly + SameSite=Lax giảm rủi ro CSRF vì /api đã tắt CSRF theo quy ước nhóm
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m
